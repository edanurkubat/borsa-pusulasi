<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Şifre Sıfırla — Borsa Pusulası</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/portfolio.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <header class="header z1">
    <div class="header-left">
      <a href="index.html" style="text-decoration:none">
        <div class="logo">
          <span class="logo-icon">◈</span>
          <span class="logo-text">BORSA<span>PUSULASI</span></span>
        </div>
      </a>
    </div>
  </header>

  <main class="portfolio-main z1" style="max-width:400px">
    <div class="panel" style="margin-top:3rem">
      <div class="panel-head"><span class="panel-title">🔑 Şifre Sıfırla</span></div>
      <div style="padding:1.5rem;display:flex;flex-direction:column;gap:1rem">

        <!-- Geçersiz link ekranı -->
        <div id="invalidScreen" style="display:none;text-align:center;padding:1rem 0">
          <div style="font-size:2.5rem;margin-bottom:1rem">🔒</div>
          <div style="font-size:0.9rem;font-weight:700;color:var(--red);margin-bottom:0.5rem">Bu link kullanılamıyor</div>
          <div style="font-size:0.75rem;color:var(--text3);margin-bottom:1.5rem">Bu şifre sıfırlama bağlantısı daha önce kullanılmış veya süresi dolmuş.</div>
          <a href="index.html" style="display:inline-block;padding:10px 20px;background:var(--green);color:var(--bg);border-radius:8px;text-decoration:none;font-family:var(--display);font-size:0.82rem;font-weight:700">
            Ana Sayfaya Dön
          </a>
        </div>

        <!-- Şifre sıfırlama formu -->
        <div id="resetForm">
          <div class="modal-field" style="display:flex;flex-direction:column;gap:5px;margin-bottom:1rem">
            <label style="font-size:0.62rem;color:var(--text3);letter-spacing:1px">Yeni Şifre</label>
            <input type="password" id="newPassword" placeholder="En az 6 karakter"
              style="background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;color:var(--text);font-family:var(--mono);font-size:0.8rem;outline:none;width:100%" />
          </div>
          <div class="modal-field" style="display:flex;flex-direction:column;gap:5px;margin-bottom:1rem">
            <label style="font-size:0.62rem;color:var(--text3);letter-spacing:1px">Yeni Şifre (Tekrar)</label>
            <input type="password" id="confirmPassword" placeholder="••••••"
              style="background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;color:var(--text);font-family:var(--mono);font-size:0.8rem;outline:none;width:100%" />
          </div>
          <div id="resetError" style="font-size:0.68rem;color:var(--red);min-height:16px;margin-bottom:0.5rem"></div>
          <button onclick="resetPassword()"
            style="width:100%;padding:11px;border:none;border-radius:8px;background:var(--green);color:var(--bg);font-family:var(--display);font-size:0.85rem;font-weight:700;cursor:pointer">
            Şifremi Sıfırla
          </button>
          <div id="resetSuccess" style="display:none;font-size:0.75rem;color:var(--green);text-align:center;margin-top:0.5rem">
            ✓ Şifren güncellendi! <a href="index.html" style="color:var(--green)">Giriş yap</a>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const theme = localStorage.getItem('theme');
      if (theme === 'light') document.body.classList.add('light');

      const token = new URLSearchParams(window.location.search).get('token');
      if (!token) { showInvalid(); return; }

      try {
        const res = await fetch('http://localhost:3000/api/auth/check-reset-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        if (!res.ok) showInvalid();
      } catch { showInvalid(); }
    });

    function showInvalid() {
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('invalidScreen').style.display = 'block';
    }

    async function resetPassword() {
      const token = new URLSearchParams(window.location.search).get('token');
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errEl = document.getElementById('resetError');
      errEl.textContent = '';

      if (!newPassword || !confirmPassword) { errEl.textContent = 'Tüm alanları doldur'; return; }
      if (newPassword.length < 6) { errEl.textContent = 'En az 6 karakter olmalı'; return; }
      if (newPassword !== confirmPassword) { errEl.textContent = 'Şifreler eşleşmiyor'; return; }

      try {
        const res = await fetch('http://localhost:3000/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword }),
        });
        const data = await res.json();
        if (!res.ok) { errEl.textContent = data.error; return; }
        document.getElementById('resetSuccess').style.display = 'block';
        document.querySelector('button').style.display = 'none';
      } catch { errEl.textContent = 'Bağlantı hatası'; }
    }
  </script>
</body>
</html>
